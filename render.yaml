# Blueprint do Render: só a API (plano gratuito). O banco é o Supabase; as telas ficam na Cloudflare Pages.
services:
  - type: web
    name: bikecare-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        # Supabase → Connect → Session pooler (porta 5432)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENC_KEY       # 32 bytes em base64: openssl rand -base64 32
        sync: false
      - key: ENABLE_RLS
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: SEED_PUBLISH
        value: "true"
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_WEBHOOK_VERIFY_TOKEN
        generateValue: true
